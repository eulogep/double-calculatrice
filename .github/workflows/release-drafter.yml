name: Changelog des pull requests

on:
    push:
        branches: [main]
    pull_request_target:
        types: [opened, reopened, synchronize, edited]

permissions:
    contents: write
    pull-requests: write

jobs:
    label-pull-request:
        if: github.event_name == 'pull_request_target'
        name: Étiqueter la pull request
        runs-on: ubuntu-latest
        steps:
            - name: Appliquer les labels de changelog
              uses: release-drafter/release-drafter/autolabeler@v7.7.0
              with:
                  config-name: release-drafter.yml

    update-release-draft:
        if: github.event_name == 'push'
        name: Préparer le changelog de release
        runs-on: ubuntu-latest
        steps:
            - name: Mettre à jour le brouillon de release
              uses: release-drafter/release-drafter@v7.7.0
              with:
                  config-name: release-drafter.yml
