name: Tests et qualité

on:
    push:
    pull_request:

permissions:
    contents: read
    id-token: write

concurrency:
    group: tests-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    unit-tests:
        name: Tests et lint sur Node.js 20
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Récupérer le dépôt
              uses: actions/checkout@v4

            - name: Configurer Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Installer les dépendances
              run: npm ci

            - name: Vérifier le formatage
              run: npm run format:check

            - name: Vérifier la qualité du code
              run: npm run lint

            - name: Exécuter les tests unitaires
              run: npm test -- --coverage

            - name: Installer Chromium pour Playwright
              run: npx playwright install --with-deps chromium

            - name: Exécuter les tests E2E
              run: npm run test:e2e

            - name: Publier la couverture sur Codecov
              uses: codecov/codecov-action@v5
              with:
                  files: ./coverage/lcov.info
                  flags: unittests
                  name: double-calculatrice
                  report_type: coverage
                  use_oidc: true
                  fail_ci_if_error: false
