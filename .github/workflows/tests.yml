name: Tests et qualité

on:
    push:
    pull_request:

permissions:
    contents: read
    id-token: write

concurrency:
    group: tests-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    unit-tests:
        name: Tests et lint sur Node.js 24
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Récupérer le dépôt
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Configurer Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24
                  cache: npm

            - name: Installer les dépendances sans scripts implicites
              run: npm ci --ignore-scripts

            - name: Vérifier le formatage
              run: npm run format:check

            - name: Vérifier la qualité du code
              run: npm run lint

            - name: Générer les assets optimisés
              run: npm run build

            - name: Exécuter les tests unitaires
              run: npm test -- --coverage

            - name: Tester la charge du module scientifique
              run: npm run test:load

            - name: Installer Chromium pour Playwright
              run: ./node_modules/.bin/playwright install --with-deps chromium

            - name: Exécuter les tests E2E
              run: npm run test:e2e

            - name: Auditer la performance et l’accessibilité
              run: npm run test:lighthouse

            - name: Archiver les rapports Lighthouse
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: lighthouse-reports
                  path: lighthouse-reports
                  if-no-files-found: warn
                  include-hidden-files: true
                  retention-days: 14

            - name: Publier la couverture sur Codecov
              uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
              with:
                  files: ./coverage/lcov.info
                  flags: unittests
                  name: double-calculatrice
                  report_type: coverage
                  use_oidc: true
                  fail_ci_if_error: false
