name: Qualité SonarQube Cloud

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, synchronize, reopened]
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: read

jobs:
    sonarqube:
        name: Analyse de qualité
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        steps:
            - name: Récupérer le dépôt
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Configurer Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 20
                  cache: npm

            - name: Installer les dépendances sans scripts implicites
              run: npm ci --ignore-scripts

            - name: Générer le rapport de couverture
              run: npm test -- --coverage

            - name: Analyser la qualité avec SonarQube Cloud
              if: env.SONAR_TOKEN != ''
              uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

            - name: Signaler la configuration requise
              if: env.SONAR_TOKEN == ''
              run: |
                  echo "L’analyse SonarQube Cloud est prête."
                  echo "Ajoutez le secret SONAR_TOKEN pour activer l’analyse et le Quality Gate."
