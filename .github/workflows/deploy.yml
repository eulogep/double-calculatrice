name: Déploiement GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        name: Publier la calculatrice
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Récupérer le dépôt
              uses: actions/checkout@v4

            - name: Configurer GitHub Pages
              uses: actions/configure-pages@v5

            - name: Préparer l’artefact statique
              run: |
                  mkdir -p _site
                  cp index.html 404.html demo.html main.js advanced-features.js scientific.mjs style.css logo-esiea.png robots.txt sitemap.xml CNAME _site/

            - name: Charger l’artefact Pages
              uses: actions/upload-pages-artifact@v3
              with:
                  path: _site

            - name: Déployer sur GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
